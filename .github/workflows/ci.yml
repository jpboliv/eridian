name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:workflows
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
